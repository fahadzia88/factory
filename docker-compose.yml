name: factory

services:
  api:
    image: gradle:jdk25
    container_name: factory-api
    # Gradle + Kotlin compiler + the app JVM need headroom; the Docker VM must have more than this to spare
    mem_limit: 2g
    working_dir: /workspace
    restart: always
    volumes:
      - ./api:/workspace
      # Reuse the host's Gradle dependency + wrapper caches
      - ~/.gradle/caches:/home/gradle/.gradle/caches
      - ~/.gradle/wrapper:/home/gradle/.gradle/wrapper
      # Project repository checkouts and their worktrees (checkout package); also mounted in agent
      - repos:/repos
    environment:
      GRADLE_USER_HOME: /home/gradle/.gradle
      DB_HOST: factory-mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-skeleton}
      DB_USER: ${MYSQL_USER:-skeleton}
      DB_PASSWORD: ${MYSQL_PASSWORD:-skeleton}
      API_TOKEN: ${API_TOKEN:-123456}
      AGENT_URL: http://agent:3000
      # Read-only GitHub token (Metadata: read) for checking project repositories exist; blank skips the check.
      # Separate from the root .env's GITHUB_TOKEN, which can write.
      GITHUB_TOKEN: ${API_GITHUB_TOKEN:-}
      # Fine-grained, Contents: read and write and Pull requests: read and write on the project
      # repositories. Used for git (clone, fetch, push) and for opening, retargeting and reading
      # pull requests. Separate from the read-only API_GITHUB_TOKEN above. Sent per git command as
      # a header, never written to disk. Blank: checkout, fetch, push and pull requests answer 503.
      GIT_TOKEN: ${API_GIT_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    # Replace with e.g. `gradle bootRun --no-daemon` once the project exists
    command: sh -c "if [ -f build.gradle ]; then gradle bootRun --no-daemon; else sleep infinity; fi"

  app:
    image: node:lts
    container_name: factory-app
    working_dir: /workspace
    volumes:
      - ./app:/workspace
      # Reuse the host's npm package cache
      - ~/.npm:/root/.npm
      # npx's lock check fails on macOS bind mounts, so keep its dir container-local
      - app_npx:/root/.npm/_npx
    environment:
      API_URL: http://api:8080
      AGENT_URL: http://agent:3000
    ports:
      - "3000:3000"
    depends_on:
      - api
      - agent
    command: sh -c "if [ -f package.json ]; then npm install && npm run dev; else sleep infinity; fi"

  agent:
    # Node 24 runs the agent's TypeScript directly (see agent/package.json engines)
    image: node:24
    container_name: factory-agent
    working_dir: /workspace
    volumes:
      - ./agent:/workspace
      # Container-local: the Claude Agent SDK installs a native binary for the platform it runs on
      - agent_node_modules:/workspace/node_modules
      - ~/.npm:/root/.npm
      - agent_npx:/root/.npm/_npx
      # Same volume as api, at the same path (worktrees hold absolute paths). The api runs network
      # git and adds/removes worktrees; the agent's workflow tools work inside them.
      - repos:/repos
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      API_URL: http://api:8080
      # Static bearer token callers (the app's /agent proxy, the api) must send; same token the api checks
      API_TOKEN: ${API_TOKEN:-123456}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Alternative to ANTHROPIC_API_KEY: a Claude subscription token from `claude setup-token` (sk-ant-oat01-…).
      # The SDK prefers ANTHROPIC_API_KEY when both are set, so leave that one empty to use this.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-factory agent}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-factory-agent@users.noreply.github.com}
      # File change events from a macOS host don't reach the container through the bind mount
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3001:3000"
    depends_on:
      - api
    command: sh -c "if [ -f package.json ]; then npm install && npm run dev; else sleep infinity; fi"

  mysql:
    image: mysql:8.4
    container_name: factory-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skeleton}
      MYSQL_USER: ${MYSQL_USER:-skeleton}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-skeleton}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  app_npx:
  agent_npx:
  agent_node_modules:
  repos:
