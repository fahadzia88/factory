spring.application.name=custom

# Static bearer token required on every API request (Authorization: Bearer <token>)
app.security.api-token=${API_TOKEN:123456}

# Never expose stack traces in error responses (devtools turns this on by default)
spring.web.error.include-stacktrace=never

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:skeleton}
spring.datasource.username=${DB_USER:skeleton}
spring.datasource.password=${DB_PASSWORD:skeleton}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# No migration tool yet: Hibernate keeps the schema in step with the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Background jobs (@Scheduled); tests switch this off
app.scheduling.enabled=true

# eve AI agent (see agent/README.md); called with app.security.api-token as the bearer token
app.agent.url=${AGENT_URL:http://localhost:3001}
# Longest wait for one reply, from sending the message to the settled answer
app.agent.timeout=${AGENT_TIMEOUT:2m}

# Read-only GitHub token for checking project repositories exist and reading their pull requests
# (Metadata: read, Pull requests: read); blank skips the check and pull request pages say it's not configured
app.github.token=${GITHUB_TOKEN:}
app.github.base-url=${GITHUB_API_URL:https://api.github.com}

# Git token for project checkouts (Contents: read and write); sent per git command as an HTTP header, never stored. Blank refuses clone, fetch and push
app.git.token=${GIT_TOKEN:}
# Shared volume with the project checkouts; the agent mounts it at the same path
app.git.root=${REPOS_ROOT:/repos}
# Longest wait for a fetch, push or any other git command
app.git.network-timeout=${GIT_NETWORK_TIMEOUT:2m}
# Longest wait for a clone
app.git.clone-timeout=${GIT_CLONE_TIMEOUT:10m}
# How often ready checkouts are fetched (only when app.scheduling.enabled)
app.git.fetch-interval=${GIT_FETCH_INTERVAL:15m}

# Bearer token of the HomeLab Controller (cluster-admin in effect); used by the api only, never returned or logged.
# Blank: cluster calls answer "not configured" and nothing is sent
app.homelab.token=${CONTROLLER_API_TOKEN:}
# Connect and read timeout of controller calls (streams have no read timeout)
app.homelab.timeout=${CONTROLLER_API_TIMEOUT:10s}
# How long a cluster's read-only mode (GET /api) is reused before it is asked again
app.homelab.status-cache=${CONTROLLER_STATUS_CACHE:30s}
# Wait before reconnecting a watch stream the controller closed; doubles up to the maximum
app.homelab.watch-backoff-initial=${CONTROLLER_WATCH_BACKOFF_INITIAL:1s}
app.homelab.watch-backoff-max=${CONTROLLER_WATCH_BACKOFF_MAX:30s}

# Author and committer of the commit the API makes when it creates a feature (feature package)
app.feature.commit-name=${FEATURE_COMMIT_NAME:factory}
app.feature.commit-email=${FEATURE_COMMIT_EMAIL:factory@users.noreply.github.com}
# Longest silence on the agent's chat stream (a long tool call) before a feature chat turn fails
app.feature.chat-idle-timeout=${FEATURE_CHAT_IDLE_TIMEOUT:5m}
