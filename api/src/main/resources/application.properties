spring.application.name=custom

# Static bearer token required on every API request (Authorization: Bearer <token>)
app.security.api-token=${API_TOKEN:123456}

# Never expose stack traces in error responses (devtools turns this on by default)
spring.web.error.include-stacktrace=never

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:skeleton}
spring.datasource.username=${DB_USER:skeleton}
spring.datasource.password=${DB_PASSWORD:skeleton}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# No migration tool yet: Hibernate keeps the schema in step with the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Background jobs (@Scheduled); tests switch this off
app.scheduling.enabled=true
